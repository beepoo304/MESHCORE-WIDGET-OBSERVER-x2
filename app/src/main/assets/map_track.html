<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>MAP — trasa mapowania</title>
<link rel="stylesheet" href="file:///android_asset/leaflet/leaflet.css">
<script src="file:///android_asset/leaflet/leaflet.js"></script>
<style>
:root{color-scheme:dark;--bg:#111315;--panel:#171A1C;--panel2:#1E2225;--line:#2A3033;--ink:#E2E5E3;--muted:#9DA4A0;--green:#67D78A;--blue:#69b8d2;--shadow:0 8px 24px #0008}
*{box-sizing:border-box}html,body,#m{height:100%;margin:0}body{font-family:Roboto,"Arial",sans-serif;background:var(--bg);color:var(--ink);letter-spacing:.01em}#m{position:absolute;inset:0 0 0}
.leaflet-container{background:#dfe7ec}.leaflet-tile-pane{filter:grayscale(1) contrast(.75) brightness(1.13)}body.tab .topline{display:none}.leaflet-control-attribution{background:#171A1CCC!important;color:#9DA4A0!important;font-size:9px!important;border-radius:6px 0 0 0}.leaflet-control-attribution a{color:var(--green)!important}
#top{position:absolute;z-index:1000;top:calc(env(safe-area-inset-top) + 10px);left:12px;right:12px;display:grid;grid-template-columns:minmax(0,1fr);gap:8px;pointer-events:none}
.topline,.selector{pointer-events:auto;background:#171A1CF2;border:1px solid #2A3033;box-shadow:var(--shadow);backdrop-filter:blur(10px);border-radius:14px}
.topline{min-height:54px;padding:8px 12px;display:flex;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1}.brandmark{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:#67d78a18;color:var(--green);font-size:17px;font-weight:700}.brandcopy{min-width:0}.brandtitle{font-size:14px;font-weight:800;letter-spacing:.11em}.brandsub{font-size:11px;color:var(--muted);margin-top:2px}
#close{border:1px solid #2A3033;background:var(--panel2);color:var(--ink);border-radius:10px;min-height:36px;padding:0 12px;font-size:11px;font-weight:700;letter-spacing:.04em}
.selector{display:flex;align-items:center;gap:9px;padding:0 12px;min-height:48px;min-width:0;max-width:100%;overflow:hidden}.selector .glyph{color:var(--green);font-size:15px;width:18px;text-align:center}.selector select{appearance:none;-webkit-appearance:none;flex:1 1 0;min-width:0;width:100%;text-overflow:ellipsis;white-space:nowrap;overflow:hidden;border:0;outline:0;background:transparent;color:var(--ink);padding:13px 24px 13px 0;font-size:13px;font-weight:600}.selector select option{background:#1b2225;color:#f0f4f2}.chevron{pointer-events:none;color:var(--muted);margin-left:-24px;font-size:12px}
#legend{position:absolute;z-index:999;right:8px;bottom:calc(22px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:4px;background:#171A1CCC;border-radius:8px;padding:3px 6px;color:var(--muted);font-size:9px;pointer-events:none}#legbar{width:56px;height:4px;border-radius:3px}
.rpt{position:relative;white-space:nowrap}.rpt i{position:absolute;left:-8px;top:-8px;width:16px;height:16px;box-sizing:border-box;border-radius:50%;background:#17323a;border:2.5px solid #fff;box-shadow:0 0 0 1px #0f2a3a88}.rpt span{position:absolute;left:12px;top:-10px;font-size:11.5px;font-weight:700;color:#0f2a3a;text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 4px #fff}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:#172023;color:#eef4f1}.leaflet-popup-content{font-size:12px;line-height:1.55}.leaflet-popup-close-button{color:#dbe4e0!important}
@media(max-width:360px){.topline{padding:7px 9px}.brandsub{font-size:10px}#close{padding:0 9px}}
</style>
</head>
<body>
<div id="m"></div>
<div id="top">
 <div class="topline"><div class="brand"><div class="brandmark">⌁</div><div class="brandcopy"><div class="brandtitle">OBSERVER</div><div class="brandsub">MeshCore · trasa mapowania</div></div></div><button id="close">← OBSERVER</button></div>
 <div class="selector"><span class="glyph">◉</span><select id="src" aria-label="Wybierz stację"></select><span class="chevron">⌄</span></div>
 <div class="selector"><span class="glyph">⌖</span><select id="sel" aria-label="Wybierz mapującego"></select><span class="chevron">⌄</span></div>
</div>
<div id="legend" title="Jakość łącza · SNR (kolor heksów)"><span>−8</span><span id="legbar"></span><span>12 dB</span></div>
<script>
const EN=(window.Android&&Android.getLang&&Android.getLang()==='en');const T=(pl,en)=>EN?en:pl;
if(EN){document.documentElement.lang='en';document.title='MAP — mapping route';document.querySelector('.brandsub').textContent='MeshCore · mapping route';document.getElementById('src').setAttribute('aria-label','Select station');document.getElementById('sel').setAttribute('aria-label','Select mapper');document.getElementById('legend').title='Link quality · SNR (hex color)';}
const STOPS=['#b2182b','#ef8a3c','#f2d15c','#5fb49c','#1b6ca8'];
const h2rgb=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
function colorAt(t){t=Math.max(0,Math.min(1,t));const x=t*(STOPS.length-1),i=Math.min(STOPS.length-2,Math.floor(x)),f=x-i;
 const a=h2rgb(STOPS[i]),b=h2rgb(STOPS[i+1]);return '#'+a.map((v,k)=>Math.round(v+(b[k]-v)*f).toString(16).padStart(2,'0')).join('');}
const snrColor=s=>s==null?'#8a99a3':colorAt((s+8)/20);
document.getElementById('legbar').style.background='linear-gradient(90deg,'+STOPS.join(',')+')';
const HEX0={lat:50,lon:19},HEX_KX=111320*Math.cos(50*Math.PI/180),HEX_KY=110574,SQ3=Math.sqrt(3);
const hexSize=z=>z>=17?18:z>=16?28:z>=15?45:z>=14?75:z>=13?130:z>=12?230:z>=11?420:z>=10?750:1400;
function hexKey(lat,lon,size){const x=(lon-HEX0.lon)*HEX_KX,y=(lat-HEX0.lat)*HEX_KY;const q=(SQ3/3*x-y/3)/size,r=(2/3*y)/size;
 let cx=q,cz=r,cy=-cx-cz,rx=Math.round(cx),ry=Math.round(cy),rz=Math.round(cz);const dx=Math.abs(rx-cx),dy=Math.abs(ry-cy),dz=Math.abs(rz-cz);
 if(dx>dy&&dx>dz)rx=-ry-rz;else if(dy>dz)ry=-rx-rz;else rz=-rx-ry;return [rx,rz];}
function hexCenter(q,r,size){const x=size*SQ3*(q+r/2),y=size*1.5*r;return [HEX0.lat+y/HEX_KY,HEX0.lon+x/HEX_KX];}
function hexRing(q,r,size){const [lat,lon]=hexCenter(q,r,size),out=[];for(let i=0;i<6;i++){const angle=Math.PI/180*(60*i-30);out.push([lat+size*Math.sin(angle)/HEX_KY,lon+size*Math.cos(angle)/HEX_KX]);}return out;}
const m=L.map('m',{zoomControl:false,attributionControl:true,touchZoom:true,doubleClickZoom:true,dragging:true,scrollWheelZoom:true,bounceAtZoomLimits:false,zoomSnap:.5,zoomDelta:1});
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> · '+T('dane: mapper MeshCore','data: MeshCore mapper')}).addTo(m);m.setView([50.25,19],11);
let REPS={},CUR=null;const dataLayer=L.layerGroup().addTo(m),repLayer=L.layerGroup().addTo(m);
function esc(s){return String(s).replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');}
const fmtT=ts=>new Date(ts).toLocaleTimeString(T('pl-PL','en-GB'),{hour:'2-digit',minute:'2-digit',second:'2-digit'});
function drawHexes(pts){const size=hexSize(Math.round(m.getZoom())),cells=new Map();for(const p of pts){const [q,r]=hexKey(p.lat,p.lon,size),key=q+':'+r;let c=cells.get(key);if(!c)cells.set(key,c={q,r,pts:[],best:null,hits:0});c.pts.push(p);let best=null;(p.h||[]).forEach(h=>{if(h.snr!=null&&(best===null||h.snr>best))best=h.snr;});if(best!=null&&(c.best===null||best>c.best))c.best=best;if(best!=null)c.hits++;}
 for(const c of [...cells.values()].sort((a,b)=>(a.best??-1e9)-(b.best??-1e9))){const style=c.best===null?{stroke:true,color:'#fff',weight:.6,opacity:.7,fillColor:'#8a99a3',fillOpacity:.3}:{color:'#fff',weight:.6,opacity:.7,fillColor:colorAt((c.best+8)/20),fillOpacity:c.hits>1?.8:.6};L.polygon(hexRing(c.q,c.r,size),style).addTo(dataLayer).bindPopup('<b>'+fmtT(c.pts[0].t)+'–'+fmtT(c.pts[c.pts.length-1].t)+'</b><br>'+c.pts.length+T(' pomiarów w heksie',c.pts.length===1?' measurement in hex':' measurements in hex')+(c.best!==null?T(' · najlepszy SNR ',' · best SNR ')+c.best+' dB':T(' · brak odpowiedzi',' · no response')));}}
function drawPoints(pts){for(const p of pts){const hit=(p.h||[]).filter(h=>h.snr!=null).sort((a,b)=>b.snr-a.snr)[0],c=hit?snrColor(hit.snr):'#8a99a3',nm=hit?(REPS[hit.n]&&REPS[hit.n].name||hit.n):'',more=(p.h||[]).length>1?' (+'+((p.h||[]).length-1)+')':'';L.circleMarker([p.lat,p.lon],{radius:hit?6:4,color:'#0f2a3a',weight:1,fillColor:c,fillOpacity:hit?.9:.55}).bindPopup('<b>'+fmtT(p.t)+'</b><br>'+(hit?esc(nm)+' · SNR '+hit.snr+' dB'+more:T('brak odpowiedzi','no response'))).addTo(dataLayer);}}
function render(d,fit){dataLayer.clearLayers();repLayer.clearLayers();const pts=d&&d.pts;if(!pts||!pts.length)return;drawHexes(pts);drawPoints(pts);const involved=new Set();pts.forEach(p=>(p.h||[]).forEach(h=>{if(REPS[h.n])involved.add(h.n);}));pts.forEach(p=>(p.h||[]).forEach(h=>{const r=REPS[h.n];if(!r)return;L.polyline([[p.lat,p.lon],[r.lat,r.lon]],{color:'#fff',weight:5.2,opacity:.7,dashArray:'6 5',interactive:false}).addTo(repLayer);L.polyline([[p.lat,p.lon],[r.lat,r.lon]],{color:snrColor(h.snr),weight:2.8,opacity:.95,dashArray:'6 5',interactive:false}).addTo(repLayer);}));const showAll=m.getZoom()>=12;for(const n in REPS){const r=REPS[n];if(!showAll&&!involved.has(n))continue;L.marker([r.lat,r.lon],{icon:L.divIcon({className:'',iconSize:[0,0],html:'<div class="rpt"><i></i><span>'+esc(r.name)+'</span></div>'})}).bindPopup('<b>📡 '+esc(r.name)+'</b>').addTo(repLayer);}if(fit){const all=[...pts.map(p=>[p.lat,p.lon]),...[...involved].map(n=>[REPS[n].lat,REPS[n].lon])];if(all.length)m.fitBounds(L.latLngBounds(all).pad(.25));}}
m.on('zoomend',()=>{if(CUR)render(CUR,false)});
const srcSel=document.getElementById('src'),userSel=document.getElementById('sel');
function fillSessions(){const ss=JSON.parse(Android.getSessions(srcSel.value));userSel.innerHTML='<option value="">'+(ss.length?T('Wybierz mapującego…','Select mapper…'):T('Brak mapujących w LOG','No mappers in LOG'))+'</option>'+ss.map(s=>'<option value="'+esc(s.id)+'">'+esc(s.label)+'</option>').join('');CUR=null;render(null,false);}
srcSel.addEventListener('change',()=>{if(window.Android)fillSessions()});userSel.addEventListener('change',()=>{if(!userSel.value){CUR=null;render(null,false);return;}let d;try{d=JSON.parse(Android.getSession(userSel.value))}catch(e){return}CUR=d;render(d,true)});
document.getElementById('close').addEventListener('click',()=>{if(window.Android)Android.close()});
function fillData(){if(!window.Android)return false;try{REPS=JSON.parse(Android.getReps())}catch(e){REPS={}}const src=JSON.parse(Android.getSources());srcSel.innerHTML=src.map(s=>'<option value="'+esc(s.id)+'">'+esc(s.label)+'</option>').join('');if(src.length)fillSessions();return true;}
window.__dataReady=function(){fillData()};
</script>
</body>
</html>
