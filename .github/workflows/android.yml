name: Android Build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v5
      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest
      - name: Build APK
        run: ./gradlew --no-daemon assembleDebug assembleRelease
      - name: Name APK files
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/ObserverWidget.apk
          cp app/build/outputs/apk/debug/app-debug.apk dist/ObserverWidget-debug.apk
      - uses: actions/upload-artifact@v5
        with:
          name: observer-widget-apk
          path: dist/*.apk
          if-no-files-found: error
      # Stały, bezpośredni link do najnowszego APK: Releases -> "latest" -> ObserverWidget.apk
      - name: Publish APK to GitHub Release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=build-${{ github.run_number }}
          NOTES="Commit ${GITHUB_SHA::7}: $(git log -1 --pretty=%s)"
          gh release create "$TAG" dist/*.apk --title "ObserverWidget build ${{ github.run_number }}" --notes "$NOTES" --target "$GITHUB_SHA" --latest
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: unit-test-report
          path: app/build/reports/tests/
          if-no-files-found: ignore

  widget-host-test:
    # Prawdziwy AppWidgetHost na emulatorze: sprawdza, czy launcher potrafi załadować widget i pobrać dane.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v5
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Widget host test on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          emulator-boot-timeout: 1200
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: |
            ./gradlew --no-daemon connectedDebugAndroidTest || touch host-test-failed
            adb logcat -d -s AndroidRuntime:E AppWidgetHostView:V ObserverWidget:V WidgetHostTest:V > widget-logcat.txt
            test ! -f host-test-failed
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: widget-host-test-report
          path: |
            widget-logcat.txt
            app/build/reports/androidTests/
          if-no-files-found: ignore
