name: Android Build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v5
      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest
      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v5
        with:
          name: observer-widget-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: unit-test-report
          path: app/build/reports/tests/
          if-no-files-found: ignore

  widget-host-test:
    # Prawdziwy AppWidgetHost na emulatorze: sprawdza, czy launcher potrafi załadować widget i pobrać dane.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v5
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Widget host test on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            ./gradlew --no-daemon connectedDebugAndroidTest || touch host-test-failed
            adb logcat -d -s AndroidRuntime:E AppWidgetHostView:V ObserverWidget:V WidgetHostTest:V > widget-logcat.txt
            test ! -f host-test-failed
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: widget-host-test-report
          path: |
            widget-logcat.txt
            app/build/reports/androidTests/
          if-no-files-found: ignore
